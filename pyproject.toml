[project]
name = "agentready"
version = "0.1.0"
description = "Public adversarial benchmark for AI agents — OWASP ASI-2026 + Z3 + chaos engineering on AMD MI300X."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Taha Mersni" }]
keywords = ["ai-agents", "owasp", "asi", "amd", "rocm", "mi300x", "red-teaming", "z3", "chaos-engineering"]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Agent orchestration
    "langgraph>=0.2.40",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",

    # SMT solving (pure Python, no compile)
    "z3-solver>=4.13.0",

    # GitHub PR generation
    "PyGithub>=2.4.0",
    "GitPython>=3.1.43",

    # Data + persistence
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Templates + certificates
    "jinja2>=3.1.4",
    "reportlab>=4.2.0",  # PDF certificate generation

    # OpenTelemetry (we emit it AND we generate it as a remediation artifact)
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",

    # Vector store for memory poisoning detection
    "chromadb>=0.5.0",

    # Embeddings (BGE-large via sentence-transformers; CPU OK as fallback)
    "sentence-transformers>=3.2.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",  # nicer CLI output
    "typer>=0.12.0", # CLI commands
]

[project.optional-dependencies]
# Inference serving — installed only on the MI300X box. vLLM ROCm wheel.
gpu = [
    "vllm>=0.6.3",
    "torch>=2.5.0",
]

# Fine-tuning. Unsloth on ROCm is the primary; fall back to peft+trl if it breaks.
finetune = [
    "unsloth>=2024.10",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.44.0",
]

# x402 paid-tier flow.
payments = [
    "x402>=0.1.0",  # Coinbase x402 Python SDK
    "web3>=7.0.0",
]

# Dev tooling
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "gitleaks-py>=0.1.0",
]

[project.scripts]
agentready = "apps.api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "agents", "owasp_asi", "chaos", "verification", "digital_twins", "finetuning", "leaderboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"owasp_asi/attack_payloads/**" = ["S105", "S106"]  # attack payloads contain "secrets"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
